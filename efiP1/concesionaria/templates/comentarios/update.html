{% extends "home/base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-3">
    <h2>{% trans "Actualizar Opinion" %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>{% trans "Nombre" %}</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label>{% trans "Descripción" %}</label>
            <textarea name="description" class="form-control" value="{{ product.description }}">{{ product.description }}</textarea>
        </div>
        <div class="form-group">
            <label>{% trans "Precio" %}</label>
            <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
        </div>
        <div class="form-group">
            <label>{% trans "Categoría" %}</label>
            <select name="id_category" class="form-control">
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if category.id == product.category.id %} selected {% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>{% trans "Stock" %}</label>
            <input type="number" name="stock" class="form-control" value="{{ product.stock }}">
        </div>
        <button type="submit" class="btn btn-primary">{% trans "Actualizar" %}</button>
    </form>
</div>
{% endblock %}
