{% extends "home/base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-3">
    <h2>{% trans "Crear Proveedor" %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>{% trans "Nombre" %}</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="form-group">
            <label>{% trans "Dirección" %}</label>
            <textarea name="direccion" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label>{% trans "Telefono" %}</label>
            <textarea name="telefono" class="form-control"></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">{% trans "Guardar" %}</button>
    </form>
</div>
{% endblock %}
