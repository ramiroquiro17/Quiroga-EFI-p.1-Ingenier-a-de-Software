{% extends "home/base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-3">
    <h2>{% trans "Registrar Auto" %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>{% trans "Marca" %}</label>
            <select name="id_marca" class="form-control">
                <option value="">Selecciona una marca</option>
                {% for marca in marcas %}
                    <option value="{{ marca.id }}">{{ marca.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>{% trans "Modelo" %}</label>
            <select name="id_modelo" class="form-control">
                <option value="">{% trans "Selecciona un modelo" %}</option>
                {% for modelo in modelos %}
                    <option value="{{ modelo.id }}">{{ modelo.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>{% trans "Categoría" %}</label>
            <select name="id_categoria" class="form-control">
                <option value="">{% trans "Selecciona una categoría" %}</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>{% trans "Pais de fabricación" %}</label>
            <select name="id_pais" class="form-control">
                <option value="">{% trans "Selecciona un pais" %}</option>
                {% for pais in paises %}
                    <option value="{{ pais.id }}">{{ pais.nombre }}</option>
                {% endfor %}
            </select>
            <div class="form-group">
                <label>{% trans "Color" %}</label>
                <select name="id_color" class="form-control">
                    <option value="">{% trans "Selecciona un color" %}</option>
                    {% for color in colores %}
                        <option value="{{ color.id }}">{{ color.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>{% trans "Precio" %}</label>
                <input type="number" step="1000" name="precio" class="form-control" required>
            </div>
            <div class="form-group">
                <label>{% trans "Numero de puertas" %}</label>
                <input type="number"  name="numero_de_puertas" class="form-control" required>
            </div>
            <div class="form-group">
                <label>{% trans "Cilindrada" %}</label>
                <input type="number"  name="cilindrada" class="form-control" required>
            </div>
            <div class="form-group">
                <label>{% trans "Tipo de Combustible" %}</label>
                <input type="text"  name="tipo_de_combustible" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">{% trans "Guardar" %}</button>
    </form>
</div>
{% endblock %}
